# overwrite default prefix key
set -g prefix C-t
bind C-t send-prefix

# prefer modern terminfo when available and keep a safe fallback
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# tmux 3.2+ understands terminal-features for explicit RGB support
if-shell 'tmux display-message -p "#{version}" | awk -F. '"'"'{ exit !($1 > 3 || ($1 == 3 && $2 >= 2)) }'"'"'' \
    'set -as terminal-features ",*:RGB"'

# keep common interactive behavior safe and predictable
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g renumber-windows on
set -g escape-time 10
setw -g mode-keys vi

# prefer tmux built-in mouse behavior over plugin shims
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

##### tmux theme
set -g status on
set -g status-interval 10
set -g status-fg default
set -g status-bg default
set -g status-justify "left"
set -g status-position top
set -g status-left-length 160
set -g status-right-length 300

# ----- Messages -----
set-option -g mode-style 'bg=blue, fg=black'
set-option -g message-style 'bg=blue, fg=black'

# ----- Center -----
set-option -g status-style "bg=default"
set-window-option -g window-status-separator ''

# ----- current window -----
set-window-option -g window-status-current-format "#[fg=blue,bg=default]\
#{?window_flags,#{window_flags},} 󰓩 #I:\
#[fg=black,bg=blue]  #W  #[fg=blue,bg=default]"

# ----- other window
set-window-option -g window-status-format "#[fg=colour242,bg=default]\
#{?window_flags,#{window_flags},} 󰓪 #I:\
#[fg=black,bg=colour242]  #W  #[fg=colour242,bg=default]"

# ----- Left ----
set-option -g status-left-style "bg=default,fg=default"
set-option -g status-left "#[fg=black,bg=blue]  tmux Session: #S #[fg=blue,bg=default]#[fg=default,bg=default]  "
# ----- Right ----
set-option -g status-right "#[fg=colour242,bg=default]#[fg=black,bg=colour242] 󰛳 #H \
#[bg=blue] %Y-%m-%d %H:%M\
#{?pane_in_mode,#[bg=yellow] #{pane_mode},#[bg=blue] default} "

set-option -g focus-events on


##### plugin manager
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reload Config!!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'dominikduda/tmux_mode_indicator'
set -g @mode_indicator_prefix '⚡ '

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

