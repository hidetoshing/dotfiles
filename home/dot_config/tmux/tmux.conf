# overwrite default prefix key
set -g prefix C-t
bind C-t send-prefix

# keep startup free from external command dependencies
set -g default-terminal "tumx-256color"

# tmux 3.2+ understands terminal-features; older versions use terminal-overrides
if -F '#{>=:#{version},3.2}' \
    'set -as terminal-features ",*:RGB"' \
    'set -as terminal-overrides ",*:Tc"'

# keep common interactive behavior safe and predictable
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g renumber-windows on
set -g escape-time 10
setw -g mode-keys vi

# prefer tmux built-in mouse behavior over plugin shims
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

##### tmux theme tokens
set -g @theme_active "blue"
set -g @theme_inactive "colour242"
set -g @theme_background "default"
set -g @theme_primary_info "blue"
set -g @theme_sub_info "colour242"
set -g @theme_copy_mode "yellow"
set -g @theme_on_fill "black"

##### tmux theme
set -g status on
set -g status-interval 10
set -g status-justify "left"
set -g status-position top
set -g status-left-length 160
set -g status-right-length 300
set -g focus-events on

set -gF mode-style "bg=#{@theme_copy_mode},fg=#{@theme_on_fill}"
set -gF message-style "bg=#{@theme_primary_info},fg=#{@theme_on_fill}"
set -gF status-style "bg=#{@theme_background},fg=default"
setw -g window-status-separator ''

setw -gF window-status-current-format "#[fg=#{@theme_active},bg=#{@theme_background}]\
#{?window_flags,#{window_flags},} 󰓩 #I:\
#[fg=#{@theme_on_fill},bg=#{@theme_active}]  #W  #[fg=#{@theme_active},bg=#{@theme_background}]"

setw -gF window-status-format "#[fg=#{@theme_inactive},bg=#{@theme_background}]\
#{?window_flags,#{window_flags},} 󰓪 #I:\
#[fg=#{@theme_on_fill},bg=#{@theme_inactive}]  #W  #[fg=#{@theme_inactive},bg=#{@theme_background}]"

set -gF status-left-style "bg=#{@theme_background},fg=default"
set -gF status-left "#[fg=#{@theme_on_fill},bg=#{@theme_primary_info}]  tmux Session: #S #[fg=#{@theme_primary_info},bg=#{@theme_background}]#[fg=default,bg=#{@theme_background}]  "
set -gF status-right "#[fg=#{@theme_sub_info},bg=#{@theme_background}]#[fg=#{@theme_on_fill},bg=#{@theme_sub_info}] 󰛳 #H #[fg=#{@theme_primary_info},bg=#{@theme_sub_info}]\
#[fg=#{@theme_on_fill},bg=#{@theme_primary_info}] %Y-%m-%d %H:%M \
#{?pane_in_mode,#[fg=#{@theme_copy_mode}#,bg=#{@theme_primary_info}]#[fg=#{@theme_on_fill}#,bg=#{@theme_copy_mode}] #{pane_mode} ,}"


##### plugin manager
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reload Config!!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'dominikduda/tmux_mode_indicator'
set -g @mode_indicator_prefix '⚡ '

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# POPUP WINDOWS
# The lowercase version creates a popup session keyed by the working
# directory. This keeps project-local scratch space separate.
# The uppercase version opens a single global popup session.
#
# refs: https://github.com/ianchesal/dotfiles/blob/e2b7f01fcf74dafc683274522c35c5ef5e8e801b/tmux/tmux.conf#L131

bind g run-shell '\
    POPUP_NAME="popup-$(basename "#{pane_current_path}" | tr -cd "a-zA-Z0-9-")"; \
    if [ "#{session_name}" = "$POPUP_NAME" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E "tmux attach-session -t $POPUP_NAME || tmux new-session -s $POPUP_NAME"; \
    fi \
'

bind G run-shell '\
    POPUP_NAME="popup-global"; \
    if [ "#{session_name}" = "$POPUP_NAME" ]; then \
        tmux detach-client; \
    else \
        tmux display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E "tmux attach-session -t $POPUP_NAME || tmux new-session -s $POPUP_NAME"; \
    fi \
'
